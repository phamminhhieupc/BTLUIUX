<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food App UI Demo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Reset & Base Styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #333; /* Giả lập nền trình duyệt tối */
        display: flex;
        justify-content: center;
        align-items: center; /* Căn giữa màn hình */
        min-height: 100vh;
    }

    /* Ẩn gạch chân của thẻ a */
    a {
        text-decoration: none;
        color: inherit;
    }

    /* App Container (Giả lập màn hình điện thoại) */
    .app-shell {
        width: 100%;
        max-width: 390px;
        height: 844px; /* Tỉ lệ iPhone */
        background-color: #121212; /* Màu nền app */
        color: #ffffff;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px; /* Nhường chỗ cho Bottom Nav */
        border-radius: 40px; /* Bo góc màn hình */
        border: 8px solid #000; /* Viền đen dày giả lập thân máy điện thoại */
        box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    }

    /* Ẩn scrollbar cho mượt */
    .app-shell::-webkit-scrollbar {
        display: none;
    }

    /* --- Status Bar Giả lập --- */
    .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 600;
        background-color: #121212;
    }
    .status-icons i { margin-left: 5px; font-size: 12px; }

    /* --- Top Bar --- */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px 10px 20px; /* Giảm padding trên vì đã có status-bar */
        background-color: #121212;
    }

    .icon-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 20px;
        cursor: pointer;
    }

    .location {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .location-label {
        font-size: 11px;
        color: #aaaaaa;
        margin-bottom: 2px;
    }

    .location-value {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }

    /* --- Hero Card (Banner) --- */
    .hero-card {
        position: relative;
        border-radius: 16px;
        margin: 15px 20px 25px 20px;
        padding: 30px 24px;
        display: flex;
        align-items: center;
        overflow: hidden;
        min-height: 180px;
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .hero-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.1) 100%);
        z-index: 1;
    }

    .hero-copy {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .eyebrow {
        font-size: 13px;
        color: #ffb86c;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .hero-copy h1 {
        font-size: 34px;
        color: #ffffff;
        margin: 0 0 6px 0;
        font-weight: 700;
        line-height: 1.1;
    }

    .hero-copy p {
        font-size: 14px;
        color: #f0f0f0;
        margin: 0 0 16px 0;
        line-height: 1.4;
        font-weight: 400;
    }

    .primary-btn {
        background-color: #ff7b00;
        color: #ffffff;
        border: none;
        padding: 8px 24px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: inline-block;
    }

    .hero-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        margin: 0;
    }

    .hero-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* --- Categories --- */
    .categories-row {
        display: flex;
        justify-content: space-between;
        padding: 0 20px 20px 20px;
    }

    .category-card {
        background: none;
        border: none;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .category-image {
        width: 65px;
        height: 65px;
        background-color: #1e1e1e;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .category-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .category-card span {
        font-size: 12px;
        font-weight: 500;
    }

    /* --- Section Header --- */
    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px 15px 20px;
    }

    .section-header h2 {
        font-size: 18px;
        font-weight: 600;
    }

    .section-header a {
        font-size: 14px;
        color: #ff7b00;
        font-weight: 500;
    }

    /* --- Recommendations Grid --- */
    .recommendations {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        padding: 0 20px 20px 20px;
    }

    .food-card {
        background-color: #1c1c1e;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .food-image {
        width: 100%;
        height: 130px;
        position: relative;
    }

    .food-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .favorite-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,0.5);
        border: none;
        color: #ffffff;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 14px;
    }

    .favorite-btn.liked i {
        color: #ff4757;
    }

    .food-content {
        padding: 12px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .food-content h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        line-height: 1.4;
    }

    .food-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
    }

    .food-meta .price {
        font-size: 14px;
        font-weight: 700;
    }

    .add-btn {
        background: none;
        border: none;
        color: #ff7b00;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- Bottom Navigation --- */
    .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 75px; /* Tăng chiều cao xíu cho thoải mái */
        background-color: #121212;
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #2a2a2a;
        padding-bottom: 25px; /* Căn chỉnh Safe Area để không dính vào viền dưới iPhone */
        z-index: 20;
    }

    .nav-item {
        background: none;
        border: none;
        color: #888888;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
    }

    .nav-item .nav-icon {
        font-size: 20px;
    }

    .nav-item.active {
        color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <header class="top-bar">
      <button class="icon-btn search-btn" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div class="location">
        <span class="location-label">Địa điểm</span>
        <button class="location-value">
          <i class="fa-solid fa-location-dot" style="color: #ff7b00; margin-right: 4px;"></i>
          Hà Nội, Việt Nam <span class="chevron">▾</span>
        </button>
      </div>
      <button class="icon-btn bell-btn" aria-label="Notifications">
        <i class="fa-regular fa-bell"></i>
      </button>
    </header>

    <section class="hero-card">
      <div class="hero-copy">
        <span class="eyebrow">Ưu đãi đặc biệt</span>
        <h1>Tháng 6</h1>
        <p>Giảm 20% cho<br>đơn hàng đầu tiên</p>
        <a class="primary-btn" href="thanh-toan.html">Đặt ngay</a>
      </div>
      <div class="hero-image">
        <img src="hero.png" alt="Banner Phở">
      </div>
    </section>

    <section class="categories-row">
      <button class="category-card active">
        <div class="category-image">
            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=100&q=80" alt="Phở">
        </div>
        <span>Phở</span>
      </button>
      <button class="category-card">
        <div class="category-image">
            <img src="https://images.unsplash.com/photo-1555126634-323283e090fa?w=100&q=80" alt="Bánh mì">
        </div>
        <span>Bánh mì</span>
      </button>
      <button class="category-card">
        <div class="category-image">
            <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?w=100&q=80" alt="Nước ép">
        </div>
        <span>Nước ép</span>
      </button>
      <button class="category-card">
        <div class="category-image">
            <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=100&q=80" alt="Cafe">
        </div>
        <span>CaFe</span>
      </button>
    </section>

    <section class="section-header">
      <h2>Gợi ý cho bạn</h2>
      <a href="#">Xem tất cả</a>
    </section>

    <section class="recommendations">
      <article class="food-card">
        <a href="pho-bo.html" class="food-card-link">
          <div class="food-image">
            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=400&q=80" alt="Phở bò">
            <button class="favorite-btn" aria-label="Like"><i class="fa-regular fa-heart"></i></button>
          </div>
          <div class="food-content">
            <h3>Phở bò truyền thống</h3>
            <div class="food-meta">
              <span class="price">35.000đ</span>
              <button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button>
            </div>
          </div>
        </a>
      </article>

      <article class="food-card">
        <a href="#" class="food-card-link">
            <div class="food-image">
              <img src="https://images.unsplash.com/photo-1555126634-323283e090fa?w=400&q=80" alt="Bánh mì">
              <button class="favorite-btn liked" aria-label="Liked"><i class="fa-solid fa-heart"></i></button>
            </div>
            <div class="food-content">
              <h3>Bánh mì thịt nướng</h3>
              <div class="food-meta">
                <span class="price">30.000đ</span>
                <button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button>
              </div>
            </div>
        </a>
      </article>

      <article class="food-card">
        <a href="#" class="food-card-link">
            <div class="food-image">
              <img src="https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=400&q=80" alt="Cơm sườn">
              <button class="favorite-btn" aria-label="Like"><i class="fa-regular fa-heart"></i></button>
            </div>
            <div class="food-content">
              <h3>Cơm sườn nướng</h3>
              <div class="food-meta">
                <span class="price">45.000đ</span>
                <button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button>
              </div>
            </div>
        </a>
      </article>

      <article class="food-card">
        <a href="#" class="food-card-link">
            <div class="food-image">
              <img src="https://images.unsplash.com/photo-1596624535384-5f532a6fccad?w=400&q=80" alt="Gỏi cuốn">
              <button class="favorite-btn" aria-label="Like"><i class="fa-regular fa-heart"></i></button>
            </div>
            <div class="food-content">
              <h3>Gỏi cuốn tôm thịt</h3>
              <div class="food-meta">
                <span class="price">28.000đ</span>
                <button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button>
              </div>
            </div>
        </a>
      </article>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active">
        <span class="nav-icon home-icon"><i class="fa-solid fa-house"></i></span>
        <span>Trang chủ</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon order-icon"><i class="fa-solid fa-list-ul"></i></span>
        <span>Đơn hàng</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon account-icon"><i class="fa-regular fa-user"></i></span>
        <span>Tài khoản</span>
      </button>
    </nav>
  </div>
</body>
</html>
