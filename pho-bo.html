<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Đặt món</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Reset & Biến cơ bản --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #333; /* Nền giả lập ngoài app */
            display: flex;
            justify-content: center;
            align-items: center; /* Căn giữa màn hình */
            min-height: 100vh;
        }

        /* --- Vùng chứa App --- */
        .app-container {
            width: 100%;
            max-width: 390px;
            background-color: #121212; /* Nền đen sâu */
            color: #ffffff;
            position: relative;
            height: 844px; /* Mô phỏng chiều cao iPhone */
            overflow-y: auto;
            border-radius: 40px; /* Bo góc màn hình đt */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding-bottom: 90px;
            border: 8px solid #000; /* Viền đen giả lập thân máy điện thoại */
        }

        /* Ẩn thanh cuộn cho mượt */
        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* --- Status Bar Giả lập --- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-icons i { 
            margin-left: 5px; 
            font-size: 12px; 
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 20px 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .header .location {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 13px;
        }

        .location span {
            color: #999;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .location .city {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            color: #e0e0e0;
        }

        /* --- Ảnh Món Ăn (Hero Image) --- */
        .hero-image {
            padding: 0 20px;
        }
        .hero-image img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* --- Phần Thông Tin --- */
        .details {
            padding: 20px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .title-row h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .title-row .brand {
            font-family: "Brush Script MT", "Comic Sans MS", cursive;
            font-size: 22px;
            color: #b0b0b0;
        }

        .description {
            font-size: 13px;
            color: #a0a0a0;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* --- Phần Gợi Ý (Có thể bạn thích) --- */
        .recommendation h2 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .cards-container {
            display: flex;
            gap: 15px;
        }

        .card {
            background-color: #1c1c1e; /* Nền xám nhạt */
            border-radius: 12px;
            display: flex;
            flex: 1;
            padding: 6px;
            align-items: center;
            gap: 10px;
        }

        .card img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .card-info h3 {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card-info .price {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-info .price span {
            color: #ff9800;
            font-size: 14px;
        }

        /* --- Thanh Công Cụ Nổi (Bottom Bar) --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px 30px 20px;
            background: linear-gradient(to top, #121212 85%, transparent);
        }

        .btn-order {
            width: 100%;
            background-color: #ff7b00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <header class="header">
            <button class="icon-btn" aria-label="Back" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            
            <div class="location">
                <span>Địa điểm</span>
                <div class="city">
                    <i class="fa-solid fa-location-dot" style="color: #ff7b00; margin-right: 4px;"></i>
                    Hà Nội, Việt Nam <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px; color: #aaaaaa;"></i>
                </div>
            </div>
            
            <button class="icon-btn" aria-label="Notifications">
                <i class="fa-regular fa-bell"></i>
            </button>
        </header>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?q=80&w=1000&auto=format&fit=crop" alt="Phở Bò Truyền Thống">
        </div>

        <div class="details">
            <div class="title-row">
                <h1>Phở Bò Truyền Thống</h1>
                <span class="brand">Phở việt</span>
            </div>
            
            <p class="description">
                Phở bò truyền thống với nước ninh từ bò, thơm ngon. Thịt bò mềm mịn mướt mượt mượt, xoáy xoáy xoay, gia vị đậm đà ăn kèm với rau sống.
            </p>

            <div class="recommendation">
                <h2>Có thể bạn thích</h2>
                <div class="cards-container">
                    
                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1555126634-323283e090fa?q=80&w=200&auto=format&fit=crop" alt="Bún thịt nướng">
                        <div class="card-info">
                            <h3>Bún thịt nướng</h3>
                            <div class="price">
                                35.000đ <i class="fa-solid fa-circle-plus" style="color: #ff7b00; margin-left: 4px;"></i>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1617093727343-374698b1b08d?q=80&w=200&auto=format&fit=crop" alt="Xôi gà">
                        <div class="card-info">
                            <h3>Xôi gà</h3>
                            <div class="price">
                                30.000đ <i class="fa-solid fa-circle-plus" style="color: #ff7b00; margin-left: 4px;"></i>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn-order" onclick="window.location.href='thanh-toan.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                Đặt món ngay
            </button>
        </div>

    </div>

</body>
</html>
