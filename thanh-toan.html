<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh Toán - Food App</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Reset & Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center; /* Căn giữa màn hình theo chiều dọc */
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    /* App Container (Giả lập màn hình điện thoại) */
    .app-shell {
      width: 100%;
      max-width: 390px;
      height: 844px; /* Fix cứng chiều cao giống màn hình iPhone */
      background-color: #121212;
      color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* Đổ bóng nổi bật */
      border-radius: 40px; /* Bo góc màn hình */
      overflow: hidden; /* Cắt các phần lòi ra khỏi góc bo tròn */
      border: 8px solid #000; /* Viền đen giả lập thân máy điện thoại */
    }

    /* Status Bar Giả lập */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      background-color: #121212; /* Đảm bảo đồng màu nền */
    }
    .status-icons i { margin-left: 5px; font-size: 12px; }

    /* Nội dung cuộn được */
    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px 20px;
    }
    .scrollable-content::-webkit-scrollbar { display: none; }

    /* --- Top Bar --- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 20px 0;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }
    .page-title {
      text-align: center;
    }
    .page-title h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .page-title span { font-size: 11px; color: #aaaaaa; }

    /* --- Khối Dữ Liệu Dùng Chung (Card) --- */
    .card-block {
      background-color: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    /* --- Địa Chỉ Nhận Hàng --- */
    .address-header {
      font-size: 13px;
      color: #aaaaaa;
      margin-bottom: 12px;
    }
    .address-body {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .address-body .fa-location-dot {
      color: #ffffff;
      font-size: 16px;
      margin-top: 2px;
    }
    .address-info {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .address-info p { margin: 0; }
    .address-body .fa-chevron-right {
      color: #aaaaaa;
      font-size: 14px;
      align-self: center;
    }

    /* --- Giỏ Hàng --- */
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cart-header h2 { font-size: 14px; font-weight: 500; }
    .cart-header .edit-btn { font-size: 13px; color: #aaaaaa; background: none; border: none; cursor: pointer; }
    
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .cart-item:last-child { margin-bottom: 0; }
    
    .item-img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
    }
    .item-details { flex: 1; }
    .item-details h3 { font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #e0e0e0; }
    .item-details .price { font-size: 13px; font-weight: 400; color: #aaaaaa; margin-bottom: 6px; }
    
    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
    }
    .quantity-control i {
      color: #ff7b00;
      font-size: 18px;
      cursor: pointer;
    }
    
    .delete-btn {
      background: none;
      border: none;
      color: #888888;
      font-size: 18px;
      cursor: pointer;
    }

    /* --- Ghi Chú --- */
    .note-input {
      width: 100%;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
    }
    .note-input::placeholder { color: #aaaaaa; }

    /* --- Tổng Tiền (Summary) --- */
    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #e0e0e0;
      margin-bottom: 12px;
    }
    .summary-line.total {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2a2a2a;
    }

    /* --- Bottom Bar --- */
    .bottom-bar {
      padding: 15px 20px 30px 20px; /* Tăng lề dưới để không cấn góc bo tròn */
      background-color: #121212;
      border-top: 1px solid #2a2a2a;
    }
    .checkout-btn {
      width: 100%;
      background-color: #ff7b00;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div class="scrollable-content">
      
      <header class="top-bar">
        <button class="icon-btn" aria-label="Back" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="page-title">
          <h1>Đặt món</h1>
          <span>2 món trong giỏ hàng</span>
        </div>
        <button class="icon-btn" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>
      </header>

      <section class="card-block">
        <div class="address-header">Địa chỉ nhận hàng</div>
        <div class="address-body">
          <i class="fa-solid fa-location-dot"></i>
          <div class="address-info">
            <p>Nguyễn Anh Hào</p>
            <p>07381728321</p>
            <p>Hồ Hoàn Kiếm, Hà Nội</p>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </section>

      <section class="card-block">
        <div class="cart-header">
          <h2>Giỏ hàng</h2>
          <button class="edit-btn">Sửa</button>
        </div>

        <div class="cart-item">
          <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=200&q=80" alt="Phở bò" class="item-img">
          <div class="item-details">
            <h3>Phở bò truyền thống</h3>
            <p class="price">35.000đ</p>
            <div class="quantity-control">
              <i class="fa-solid fa-circle-minus" style="color: #ff7b00; background: #333; border-radius: 50%;"></i>
              <span>1</span>
              <i class="fa-solid fa-circle-plus"></i>
            </div>
          </div>
          <button class="delete-btn"><i class="fa-regular fa-trash-can"></i></button>
        </div>

        <div class="cart-item">
          <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?w=200&q=80" alt="Nước ép" class="item-img">
          <div class="item-details">
            <h3>Nước ép dưa hấu</h3>
            <p class="price">35.000đ</p>
            <div class="quantity-control">
              <i class="fa-solid fa-circle-minus" style="color: #ff7b00; background: #333; border-radius: 50%;"></i>
              <span>1</span>
              <i class="fa-solid fa-circle-plus"></i>
            </div>
          </div>
          <button class="delete-btn"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </section>

      <section class="card-block">
        <textarea class="note-input" rows="2" placeholder="Ghi chú cho đơn hàng"></textarea>
      </section>

      <section class="card-block">
        <div class="summary-line">
          <span>Tạm tính</span>
          <span>70.000đ</span>
        </div>
        <div class="summary-line">
          <span>Phí ship</span>
          <span>Miễn phí</span>
        </div>
        <div class="summary-line total">
          <span>Tổng Cộng</span>
          <span>70.000đ</span>
        </div>
      </section>

    </div>

    <div class="bottom-bar">
      <button class="checkout-btn">Thanh toán</button>
    </div>

  </div>

</body>
</html>
